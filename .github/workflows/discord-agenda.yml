name: Agenda ARW → Discord

on:
  schedule:
    - cron: "*/5 * * * *"   # tiap 5 menit (GitHub kadang telat beberapa menit)
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

permissions:
  contents: write            # untuk menyimpan penanda "sudah terkirim"

concurrency:
  group: discord-agenda
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kirim agenda ke Discord
        env:
          WEBHOOK_REKAP: ${{ secrets.WEBHOOK_REKAP }}
          WEBHOOK_REMINDER: ${{ secrets.WEBHOOK_REMINDER }}
          MENTION: ${{ vars.MENTION }}
        run: node scripts/discord-agenda.mjs
      - name: Simpan penanda terkirim
        run: |
          if ! git diff --quiet -- .github/state/sent.json; then
            git config user.name "arw-bot"
            git config user.email "arw-bot@users.noreply.github.com"
            git add .github/state/sent.json
            git commit -m "state: agenda terkirim [skip ci]"
            git pull --rebase
            git push
          fi
